name: Links

# Checks the links in the README and the docs of every lesson once a week.
# Local addresses and public IPFS gateways are never requested.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [lesson01, lesson02, lesson03, lesson04, lesson05, main]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --exclude '^https?://localhost'
            --exclude '^https?://[^/]*\.localhost'
            --exclude '(^|\.)ipfs\.io(/|$)'
            --exclude '(^|\.)dweb\.link(/|$)'
            --exclude '(^|\.)inbrowser\.link(/|$)'
            --exclude 'aleph\.sh(/|$)'
            --exclude 'example\.org'
            README.md docs
