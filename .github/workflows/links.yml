name: Links

# Checks the links in the README and in docs/ once a week. One workspace, one run:
# the lesson branches are frozen and no longer checked.
# Local addresses and public IPFS gateways are never requested.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --exclude '^https?://localhost'
            --exclude '^https?://[^/]*\.localhost'
            --exclude '(^|\.)ipfs\.io(/|$)'
            --exclude '(^|\.)dweb\.link(/|$)'
            --exclude '(^|\.)inbrowser\.link(/|$)'
            --exclude 'aleph\.sh(/|$)'
            --exclude 'example\.org'
            README.md docs
