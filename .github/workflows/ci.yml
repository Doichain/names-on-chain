name: CI

# One workspace, one run: the shared package and all five lesson apps.
# The lesson branches keep their own copy of this file until they are retired.

on:
  push:
    branches: [main, 'lesson*']
  pull_request:
    branches: [main, 'lesson*']
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # the pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier and ESLint)
        run: pnpm run lint
      - name: Type check (svelte-check, every app)
        run: pnpm run check
      - name: Unit tests (the package once, then every app)
        run: pnpm run test:unit
      - name: Build every app
        run: pnpm run build
      - name: Browser for the tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests, against a simulated ElectrumX
        run: pnpm run test:integration
