name: CI

# One workspace, one run: the shared package and all five lesson apps.
# The frozen lesson branches keep their own copy of this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # the pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Prettier and ESLint)
        run: pnpm run lint
      - name: Type check (svelte-check, every app)
        run: pnpm run check
      - name: Unit tests (the package once, then every app)
        run: pnpm run test:unit
      - name: Build every app
        run: pnpm run build
      - name: Browser for the tests
        # Playwright is a dependency of the apps, not of the workspace root, and
        # one install serves all five of them.
        run: pnpm --filter @names-on-chain/lesson01 exec playwright install --with-deps chromium
      - name: Browser tests, against a simulated ElectrumX
        run: pnpm run test:integration

  start-states:
    name: Start states still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every lesson marks the code it teaches
        run: pnpm start-state --check
      # A start state that does not compile is worse than none: blank every lesson
      # and let svelte-check and the build have their say. Nothing is committed.
      - name: Blank them all
        run: pnpm start-state --all
      - name: They still type-check
        run: pnpm run check
      - name: They still build
        run: pnpm run build
