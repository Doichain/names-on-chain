name: GitHub Pages

# Builds every lesson branch and publishes each one under its own path:
#   https://doichain.github.io/names-on-chain/lesson01/ ... /lesson05/
# Fixes reach main through the forward merges (lesson01 -> ... -> main), so a
# push to main rebuilds all lessons from the current heads of their branches.
#
# The same folder is pinned on IPFS through Aleph (job ipfs) once the
# repository secret ALEPH_PRIVATE_KEY is set, and a custom domain follows the
# newest version (job link-domain) once the repository variable
# ALEPH_SITE_DOMAIN is set. Set that variable only after the DNS records exist,
# see docs/ipfs.md. Both jobs reach IPFS content over libp2p only, never
# through an HTTP gateway.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build lessons
    runs-on: ubuntu-latest
    outputs:
      aleph: ${{ steps.aleph.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build every lesson from its branch
        run: |
          mkdir -p pages
          touch pages/.nojekyll
          for lesson in lesson01 lesson02 lesson03 lesson04 lesson05; do
            git fetch --depth 1 origin "$lesson"
            mkdir -p "build/$lesson"
            git archive FETCH_HEAD | tar -x -C "build/$lesson"
            pnpm --dir "build/$lesson" install --frozen-lockfile
            pnpm --dir "build/$lesson" run build
            cp -R "build/$lesson/public" "pages/$lesson"
          done

      - name: Write the lesson overview
        run: |
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Names-On-Chain lessons</title>
              <style>
                :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7f9; color: #15212a; }
                body { margin: 0; }
                main { width: min(860px, calc(100vw - 32px)); margin: 0 auto; padding: 32px 0 48px; }
                .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
                h1 { margin: 16px 0 8px; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; }
                p { max-width: 64ch; line-height: 1.6; color: #4b5b66; }
                .note { border-left: 3px solid #b4520a; background: #fdf3e7; color: #5c2c05; padding: 10px 14px; border-radius: 0 6px 6px 0; }
                .flags { display: flex; gap: 4px; }
                .flags button { font-size: 1.4rem; line-height: 1; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; opacity: .45; }
                .flags button[aria-pressed="true"] { opacity: 1; }
                .flags button:hover, .flags button:focus-visible { opacity: .9; background: rgb(31 77 184 / 10%); }
                ol { list-style: none; padding: 0; display: grid; gap: 12px; margin-top: 28px; }
                a.lesson { display: block; padding: 16px 18px; border: 1px solid #cdd6db; border-radius: 8px; background: #fff; color: inherit; text-decoration: none; }
                a.lesson:hover, a.lesson:focus-visible { border-color: #1f4db8; }
                a.lesson strong { display: block; margin-bottom: 4px; }
                a.lesson span { color: #4b5b66; }
                @media (prefers-color-scheme: dark) {
                  :root { background: #0e1419; color: #e2e9ee; }
                  p, a.lesson span { color: #a3b1bb; }
                  a.lesson { background: #141c23; border-color: #26333c; }
                  .note { background: #3a2616; color: #ffd9b5; border-color: #ffb27a; }
                  a { color: #93aeff; }
                }
              </style>
            </head>
            <body>
              <main>
                <div class="top">
                  <h1>Names-On-Chain</h1>
                  <div class="flags">
                    <button type="button" data-lang="de" lang="de" aria-label="Deutsch" title="Deutsch" aria-pressed="false">🇩🇪</button>
                    <button type="button" data-lang="en" lang="en" aria-label="English" title="English" aria-pressed="true">🇬🇧</button>
                  </div>
                </div>
                <p data-i18n="intro">A hands-on PSBT and NameOp workshop on Doichain: look up, register and trade names without a private key in the browser. Each lesson is a branch of the repository, built and published here.</p>
                <p class="note" data-i18n="note">The apps talk to Doichain mainnet. A PSBT you sign in your wallet spends real DOI, so check every output before you sign.</p>
                <ol>
                  <li><a class="lesson" href="./lesson01/"><strong data-i18n="l1">Lesson 1 – Talk to the chain</strong><span data-i18n="l1d">Connect to ElectrumX and look up a Doichain name.</span></a></li>
                  <li><a class="lesson" href="./lesson02/"><strong data-i18n="l2">Lesson 2 – UTXOs, name coins and expiry</strong><span data-i18n="l2d">Read the coins and names of an address, scan the QR code of an address.</span></a></li>
                  <li><a class="lesson" href="./lesson03/"><strong data-i18n="l3">Lesson 3 – A name registration transaction</strong><span data-i18n="l3d">Locked amount, mining fee and change for a new name.</span></a></li>
                  <li><a class="lesson" href="./lesson04/"><strong data-i18n="l4">Lesson 4 – A PSBT over QR</strong><span data-i18n="l4d">Hand the unsigned transaction to DoiWallet as an animated QR code.</span></a></li>
                  <li><a class="lesson" href="./lesson05/"><strong data-i18n="l5">Lesson 5 – Atomic name trading</strong><span data-i18n="l5d">Build a PSBT that swaps a name for DOI in a single transaction.</span></a></li>
                </ol>
                <p><span data-i18n="wallet">Sign the PSBTs with DoiWallet:</span>
                  <a href="https://play.google.com/store/apps/details?id=org.doichain.doiwallet">Google Play (Android)</a> ·
                  <a href="https://apps.apple.com/app/doiwallet/id1579900361">App Store (iPhone)</a> ·
                  <a href="https://github.com/davidreband/DoiWallet" data-i18n="walletSource">Source code</a></p>
                <p><a href="https://github.com/Doichain/names-on-chain" data-i18n="source">Source code, lesson texts and known issues</a></p>
              </main>
              <script>
                // Same storage key as the lesson apps, so a choice made here carries over.
                const KEY = 'namesOnChain.locale';
                const de = {
                  title: 'Names-On-Chain – Lektionen',
                  intro: 'Ein praktischer Workshop zu PSBTs und NameOps auf Doichain: Namen nachschlagen, registrieren und handeln – ohne privaten Schlüssel im Browser. Jede Lektion ist ein Branch des Repositorys und wird hier gebaut und veröffentlicht.',
                  note: 'Die Apps arbeiten mit dem Doichain-Mainnet. Ein PSBT, das Sie in Ihrer Wallet signieren, gibt echte DOI aus – prüfen Sie deshalb jede Ausgabe, bevor Sie signieren.',
                  l1: 'Lektion 1 – Mit der Kette sprechen', l1d: 'Mit ElectrumX verbinden und einen Doichain-Namen nachschlagen.',
                  l2: 'Lektion 2 – UTXOs, Namens-Coins und Ablauf', l2d: 'Coins und Namen einer Adresse lesen, den QR-Code einer Adresse scannen.',
                  l3: 'Lektion 3 – Eine Namensregistrierung als Transaktion', l3d: 'Gebundener Betrag, Mining-Gebühr und Wechselgeld für einen neuen Namen.',
                  l4: 'Lektion 4 – Ein PSBT per QR-Code', l4d: 'Die unsignierte Transaktion als animierten QR-Code an DoiWallet übergeben.',
                  l5: 'Lektion 5 – Atomarer Namenshandel', l5d: 'Ein PSBT bauen, das einen Namen in einer einzigen Transaktion gegen DOI tauscht.',
                  wallet: 'Die PSBTs signieren Sie mit DoiWallet:', walletSource: 'Quellcode',
                  source: 'Quellcode, Lektionstexte und bekannte Probleme'
                };
                const en = { title: document.title };
                document.querySelectorAll('[data-i18n]').forEach((el) => { en[el.dataset.i18n] = el.textContent; });
                function apply(lang) {
                  const dict = lang === 'de' ? de : en;
                  document.documentElement.lang = lang;
                  document.title = dict.title;
                  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = dict[el.dataset.i18n]; });
                  document.querySelectorAll('.flags button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
                }
                let start = 'en';
                try { const stored = localStorage.getItem(KEY); if (stored === 'de' || stored === 'en') start = stored; else if ((navigator.language || '').slice(0, 2).toLowerCase() === 'de') start = 'de'; } catch { /* storage blocked */ }
                apply(start);
                document.querySelectorAll('.flags button').forEach((b) => b.addEventListener('click', () => {
                  apply(b.dataset.lang);
                  try { localStorage.setItem(KEY, b.dataset.lang); } catch { /* storage blocked */ }
                }));
              </script>
            </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Check whether IPFS publishing is set up
        id: aleph
        env:
          KEY_SET: ${{ secrets.ALEPH_PRIVATE_KEY != '' }}
        run: echo "enabled=$KEY_SET" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy lessons
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ipfs:
    name: Pin lessons on IPFS
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.aleph == 'true'
    runs-on: ubuntu-latest
    # The Aleph key goes to code from another repository: no write access here.
    permissions:
      contents: read
    outputs:
      item_hash: ${{ steps.publish.outputs.item_hash }}
      ipfs_cid: ${{ steps.publish.outputs.ipfs_cid }}
      ipfs_cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
    steps:
      - name: Download the built lessons
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact

      - name: Unpack them
        run: |
          mkdir site
          tar -xf artifact/artifact.tar -C site

      # Packs site/ into a CAR file, uploads it with a signed Aleph STORE message
      # and waits until Aleph has processed the message. verify: libp2p then
      # fetches every block from the IPFS network with a Helia node instead of
      # asking Aleph's HTTP gateway. Pinned to a commit, not a branch, because
      # the step receives the Aleph key.
      - name: Publish through Aleph
        id: publish
        uses: NiKrause/relay-button/.github/actions/aleph-site-publish@462552631223db974893f0ad7ddd08b019e8f09c
        with:
          directory: site
          project_dir: ${{ github.workspace }}
          aleph_private_key: ${{ secrets.ALEPH_PRIVATE_KEY }}
          channel: ALEPH-CLOUDSOLUTIONS
          site_name: names-on-chain
          verify: libp2p

  link-domain:
    name: Point the custom domain at the new version
    needs: ipfs
    if: vars.ALEPH_SITE_DOMAIN != '' && needs.ipfs.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the Aleph site runner
        uses: actions/checkout@v6
        with:
          repository: NiKrause/relay-button
          ref: 462552631223db974893f0ad7ddd08b019e8f09c
          path: relay-button
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install the site runner
        run: pnpm --dir relay-button --filter @le-space/node... install --frozen-lockfile

      # Aleph serves the domain only when its _control TXT record names the
      # address of ALEPH_PRIVATE_KEY. The step checks the domain through its
      # DNSLink record, not over HTTP, and fails when that record does not name
      # the new CID within about five minutes.
      - name: Link ${{ vars.ALEPH_SITE_DOMAIN }}
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_DOMAIN: ${{ vars.ALEPH_SITE_DOMAIN }}
          ALEPH_SITE_ITEM_HASH: ${{ needs.ipfs.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.ipfs.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.ipfs.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN_VERIFY: dnslink
          # No fallback page: a wrong path should answer 404, not the overview,
          # whose relative links would break there.
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: ''
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('${{ github.workspace }}/relay-button/packages/node/src/index.ts').then((m) => m.runSiteMode())"
