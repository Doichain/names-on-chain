name: GitHub Pages

# Builds every lesson app of the workspace and publishes each one under its own
# path: https://doichain.github.io/names-on-chain/lesson01/ ... /lesson05/
# The apps live in apps/ and share packages/doichain, so one push to main
# rebuilds all five from the same tree.
#
# The same folder is pinned on IPFS through Aleph (job ipfs) once the
# repository secret ALEPH_PRIVATE_KEY is set, and a custom domain follows the
# newest version (job link-domain) once the repository variable
# ALEPH_SITE_DOMAIN is set. Set that variable only after the DNS records exist,
# see docs/ipfs.md. Both jobs reach IPFS content over libp2p only, never
# through an HTTP gateway.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build lessons
    runs-on: ubuntu-latest
    outputs:
      aleph: ${{ steps.aleph.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      # the pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build every lesson app from the workspace
        run: |
          mkdir -p pages
          touch pages/.nojekyll
          pnpm install --frozen-lockfile
          pnpm run build
          for lesson in lesson01 lesson02 lesson03 lesson04 lesson05; do
            cp -R "apps/$lesson/public" "pages/$lesson"
          done

      - name: Copy the picture a shared link shows
        # The apps ship it in static/; the overview page points at the root copy.
        run: cp apps/lesson05/public/og-image.png pages/og-image.png

      - name: Write the lesson overview
        # site/index.html is a real file now, so it can be linted and tested
        # (apps/lesson01/tests/overview.spec.js) instead of living in this heredoc.
        # The footer's build stamp: the commit and its instant, never the clock, so a
        # rebuild of the same commit gives the same bytes.
        run: |
          sed -e "s/__BUILD_COMMIT__/$(git log -1 --format=%h)/g" \
              -e "s|__BUILD_DATE__|$(git log -1 --format=%cI)|g" \
              site/index.html > pages/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Check whether IPFS publishing is set up
        id: aleph
        env:
          KEY_SET: ${{ secrets.ALEPH_PRIVATE_KEY != '' }}
        run: echo "enabled=$KEY_SET" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy lessons
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ipfs:
    name: Pin lessons on IPFS
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.aleph == 'true'
    runs-on: ubuntu-latest
    # The Aleph key goes to code from another repository: no write access here.
    permissions:
      contents: read
    outputs:
      item_hash: ${{ steps.publish.outputs.item_hash }}
      ipfs_cid: ${{ steps.publish.outputs.ipfs_cid }}
      ipfs_cid_v0: ${{ steps.publish.outputs.ipfs_cid_v0 }}
      store_processed: ${{ steps.publish.outputs.store_processed }}
    steps:
      - name: Download the built lessons
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: artifact

      - name: Unpack them
        run: |
          mkdir site
          tar -xf artifact/artifact.tar -C site

      # Packs site/ into a CAR file, uploads it with a signed Aleph STORE message
      # and waits until Aleph has processed the message. verify: libp2p then
      # fetches every block from the IPFS network with a Helia node instead of
      # asking Aleph's HTTP gateway. The node enters the network through Aleph's
      # own IPFS nodes, so it still works when the public bootstrap nodes go
      # away on 2026-09-30. Pinned to a commit, not a branch, because the step
      # receives the Aleph key.
      - name: Publish through Aleph
        id: publish
        uses: NiKrause/relay-button/.github/actions/aleph-site-publish@e5f57dda570c8dbbb8775def68d1d41e2e464770
        with:
          directory: site
          project_dir: ${{ github.workspace }}
          aleph_private_key: ${{ secrets.ALEPH_PRIVATE_KEY }}
          channel: ALEPH-CLOUDSOLUTIONS
          site_name: names-on-chain
          verify: libp2p

  link-domain:
    name: Point the custom domain at the new version
    needs: ipfs
    if: vars.ALEPH_SITE_DOMAIN != '' && needs.ipfs.outputs.store_processed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the Aleph site runner
        uses: actions/checkout@v6
        with:
          repository: NiKrause/relay-button
          ref: e5f57dda570c8dbbb8775def68d1d41e2e464770
          path: relay-button
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install the site runner
        run: pnpm --dir relay-button --filter @le-space/node... install --frozen-lockfile

      # Aleph serves the domain only when its _control TXT record names the
      # address of ALEPH_PRIVATE_KEY. The step checks the domain through its
      # DNSLink record, not over HTTP, and fails when that record does not name
      # the new CID within about five minutes.
      - name: Link ${{ vars.ALEPH_SITE_DOMAIN }}
        env:
          ALEPH_VM_MODE: site-domain-link
          ALEPH_SITE_DOMAIN: ${{ vars.ALEPH_SITE_DOMAIN }}
          ALEPH_SITE_ITEM_HASH: ${{ needs.ipfs.outputs.item_hash }}
          ALEPH_SITE_IPFS_CID: ${{ needs.ipfs.outputs.ipfs_cid }}
          ALEPH_SITE_IPFS_CID_V0: ${{ needs.ipfs.outputs.ipfs_cid_v0 }}
          ALEPH_SITE_DOMAIN_VERIFY: dnslink
          # No fallback page: a wrong path should answer 404, not the overview,
          # whose relative links would break there.
          ALEPH_SITE_DOMAIN_CATCH_ALL_PATH: ''
          ALEPH_PRIVATE_KEY: ${{ secrets.ALEPH_PRIVATE_KEY }}
        run: node --input-type=module -e "import('${{ github.workspace }}/relay-button/packages/node/src/index.ts').then((m) => m.runSiteMode())"
