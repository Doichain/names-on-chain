<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Le-Space brand set (Le-Space/landing, docs/le-space-brand): the SVG for
		     browsers that take it, the .ico for the rest, apple-touch for iOS. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/le-space-favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The theme before the first paint: a stored choice, else the system's. -->
		<script>
			try {
				const t = localStorage.getItem('namesOnChain.theme');
				if (t === 'dark' || (t === null && matchMedia('(prefers-color-scheme: dark)').matches))
					document.documentElement.classList.add('dark');
			} catch {}
		</script>
		<title>Names-on-Chain</title>
		<meta
			name="description"
			content="Register and trade Doichain names with PSBTs, without a private key in the browser"
		/>
		<!--
			What a link to this page looks like when somebody shares it. The tags are
			static and their URLs absolute on purpose: a crawler does not run the app,
			and several of them do not resolve a relative og:image either. Every
			lesson deploys under its own path but points here, at the demo of the
			finished app.
		-->
		<link rel="canonical" href="https://doichain.github.io/names-on-chain/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Names-on-Chain" />
		<meta property="og:url" content="https://doichain.github.io/names-on-chain/" />
		<meta property="og:title" content="Names-on-Chain" />
		<meta
			property="og:description"
			content="Register and trade Doichain names with PSBTs, without a private key in the browser"
		/>
		<meta property="og:image" content="https://doichain.github.io/names-on-chain/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Names-on-Chain: register and trade Doichain names with PSBTs, in three steps"
		/>
		<meta property="og:locale" content="en_US" />
		<meta property="og:locale:alternate" content="de_DE" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Names-on-Chain" />
		<meta
			name="twitter:description"
			content="Register and trade Doichain names with PSBTs, without a private key in the browser"
		/>
		<meta name="twitter:image" content="https://doichain.github.io/names-on-chain/og-image.png" />
		<meta
			name="twitter:image:alt"
			content="Names-on-Chain: register and trade Doichain names with PSBTs, in three steps"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
